name: dental_clinic
description: "A desktop application to manage a dental clinic"


publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'


dependencies:
  lottie: ^3.1.1
  udp: ^5.0.3
  test: ^1.22.0
  mockito: ^5.4.0
  shelf: ^1.4.1
  shelf_web_socket: ^1.0.3
  html: ^0.15.0
  sqlite3_flutter_libs: ^0.5.15
  build_runner: ^2.3.3
  provider: ^6.1.2
  get_it: ^8.0.2
  easy_localization: ^3.0.0
  fluent_ui: ^4.9.1
  sqflite_common_ffi: ^2.0.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  http: ^1.2.2
  sqflite: ^2.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter



  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.0



# The following section is specific to Flutter packages.
flutter:
  generate: true

  uses-material-design: true


  assets:
    - assets/
    - assets/teeth_images/
    - assets/jsons/
    - assets/lottie/


  # An image asset can refer to one or more resolution-specific "variants", see
